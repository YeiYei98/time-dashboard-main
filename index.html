<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Time tracking dashboard</title>
  <script defer src="main.js"></script>
  <link href="styles.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@300;400;500&display=swap" rel="stylesheet">
  
</head>
<body>
  <main class="container-main">
    <article class="card-perfil">
      <header class="perfil">
        <img class="imagen-jeremy" src="./images/image-jeremy.png" alt="Imagen de Jeremy Robson" width="50">
        <h1><span>Report for</span>
        Jeremy Robson</h1>
      </header>
      <nav class="botones">
        <button type="button" id="daily">Daily</button>
        <button type="button" id="weekly" class="seleccionado">Weekly</button>
        <button type="button" id="monthly">Monthly</button>
      </nav>
    </article>
    <section class="seccion-card"></section>
      
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Ernesto González</a>.
  </footer>
</body>
</html>
